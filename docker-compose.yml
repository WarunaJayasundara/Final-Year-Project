# One-command local/production-like stack: MySQL + ML service + the web app
# (Laravel API serving the built React SPA on a single origin).
#
#   cp .env.docker.example .env.docker   # then edit it
#   docker compose up --build            # http://localhost:8080

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file: .env.docker
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  ml:
    build: ./ml-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Question images and admin uploads persist across container rebuilds.
      - app_storage:/var/www/html/storage/app/public

volumes:
  db_data:
  app_storage:
